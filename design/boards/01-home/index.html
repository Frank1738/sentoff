<style>
body{margin:0}
a{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F5C518;outline-offset:2px}
input::placeholder{color:#A3ADA5}
input:focus{outline:none;border-color:#EEEBE3 !important}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px 32px; background: #0F1612; color: #EEEBE3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <span aria-hidden="true" style="display: block; width: 15px; height: 21px; background: #FF4B3E; border-radius: 2px;"></span>
    <span style="font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1;">FPL Roast</span>
  </div>
  <h1 style="margin: 150px 0 0; font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.02;">Every manager in your mini-league, rated.</h1>
  <form novalidate="novalidate" sc-camel-on-submit="{{ submit }}" style="margin-top: 48px; display: flex; flex-direction: column; gap: 10px;">
    <label for="league-input" style="font-size: 15px; font-weight: 500;">League ID, league URL or team ID</label>
    <input id="league-input" name="league" type="text" inputmode="url" autocomplete="off" placeholder="314159" value="{{ value }}" sc-camel-on-change="{{ onType }}" aria-invalid="{{ invalid }}" aria-describedby="league-error" style="height: 56px; box-sizing: border-box; padding: 0 16px; background: #1D2922; border: 1px solid {{ inputBorder }}; border-radius: 3px; color: #EEEBE3; font-family: Inter, system-ui, sans-serif; font-size: 18px; font-variant-numeric: tabular-nums;">
    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ false }}">
      <p id="league-error" role="alert" style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px;"><span role="img" aria-label="Yellow card" style="display: inline-block; flex: 0 0 auto; width: 14px; height: 19px; border-radius: 2px; box-sizing: border-box; border: 1px solid rgba(15,22,18,0.45); background: #F5C518;"></span>Paste a league ID, league URL or team ID first.</p>
    </sc-if>
    <button type="submit" style="margin-top: 4px; height: 56px; background: #FF4B3E; color: #0F1612; border: 0; border-radius: 3px; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 17px; cursor: pointer;">{{ submitLabel }}</button>
  </form>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <a href="Loading.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #EEEBE3; text-underline-offset: 4px;">Try a demo league</a>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #A3ADA5;">Your ID: Leagues &amp; Cups › your league › the number in the URL.</p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { value: '', invalid: false, busy: false }; }
  renderVals() {
    return {
      value: this.state.value,
      invalid: this.state.invalid,
      inputBorder: this.state.invalid ? '#F5C518' : '#7A8A80',
      submitLabel: this.state.busy ? 'Fetching the league\u2026' : 'Roast the league',
      onType: (e) => this.setState({ value: e.target.value, invalid: false }),
      submit: (e) => {
        e.preventDefault();
        if (!this.state.value.trim()) this.setState({ invalid: true, busy: false });
        else this.setState({ invalid: false, busy: true });
      }
    };
  }
}
</script>
