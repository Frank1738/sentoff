    const L = this.lib();
    const k = this.props.manager ?? 'dave';
    const d = L.DATA.find((x) => x.key === k) || L.DATA[6];
    const m = L.decorate(d, 1);
    m.alt = m.shareMeta + '. ' + m.name + ', rated ' + m.rating + ' out of 10. ' + m.line;
    return { m };
  }
}
</script>
